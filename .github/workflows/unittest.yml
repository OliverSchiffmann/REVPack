name: Unittest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          pip install -e .
      - name: Run Unittest
        run: python -m unittest
